name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # for PyPI trusted publishing (OIDC)

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/polyroute
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Check that tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml','rb').read().decode())['project']['version'])")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match pyproject.toml version v$VERSION" >&2
            exit 1
          fi

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify artifacts
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Trusted publishing — configure on pypi.org/manage/project/polyroute
          # No API token needed once set up.
          skip-existing: true
