[build-system]
requires = ["setuptools>=64,<77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyroute"
version = "0.1.0"
description = "Agentic multi-modal journey planning with Pareto-optimal routing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kirtirajsinh Atodariya" }]
license = { text = "MIT" }
keywords = ["transit", "routing", "mobility", "agentic", "langgraph", "multimodal"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]
llm = [
    "anthropic>=0.34",
    "openai>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.2",
    "twine>=5.0",
]

[project.scripts]
polyroute-demo = "examples.toronto_airport:main"

[tool.setuptools.packages.find]
include = ["polyroute*"]
exclude = ["tests*", "docker*", "web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require external services (OTP2, GBFS, LLM APIs). Opt-in with `pytest -m integration`.",
]

[tool.ruff]
line-length = 100
target-version = "py310"
